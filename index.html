<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b28"><title>Mnemonica Coach</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f4f6fa;background:#101b28}*{box-sizing:border-box}body{margin:0}main{max-width:520px;margin:auto;padding:24px 18px 90px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:12px 0 4px}h2{font-size:20px}.muted{color:#9eafc1}.panel{background:#1d2b3b;border:1px solid #344357;border-radius:20px;padding:18px;margin-top:18px}.stat{display:flex;justify-content:space-between;gap:10px}.stat>div{flex:1;text-align:center;background:#26384b;padding:12px 4px;border-radius:12px}.stat strong{display:block;font-size:22px}button,input,select{font:inherit}button{border:0;border-radius:13px;background:#d5b779;color:#172333;font-weight:700;padding:14px 16px;cursor:pointer}button.secondary{background:#31465d;color:white}button:disabled{opacity:.4}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1}.card{background:#fff;color:#1a2230;border-radius:16px;border:2px solid #e1e5e8;width:170px;height:238px;margin:20px auto;display:flex;flex-direction:column;justify-content:space-between;padding:12px;box-shadow:0 12px 25px #0004}.card .corner{font-size:24px;font-weight:800}.card .center{font-size:64px;text-align:center}.red{color:#cb263a}.question{text-align:center;font-size:23px;font-weight:750;margin-top:22px}.number{font-size:88px;text-align:center;font-weight:800;margin:35px 0}.answer{width:100%;padding:15px;border-radius:12px;background:#101b28;color:white;border:1px solid #61738a;font-size:20px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.grid button{padding:11px 2px}.small{font-size:13px}.hidden{display:none}.good{color:#86d7a6}.bad{color:#ff9a9a}.pill{display:inline-block;background:#30465a;padding:6px 10px;border-radius:30px;font-size:12px}.stack{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stack>div{background:#26384b;padding:10px;border-radius:10px}textarea{width:100%;min-height:76px;background:#101b28;color:white;border:1px solid #53677c;border-radius:10px;padding:10px}nav{position:fixed;bottom:0;left:0;right:0;background:#152333;border-top:1px solid #344357;display:flex;justify-content:center;padding:10px 10px max(10px,env(safe-area-inset-bottom))}.memory-art{display:block;width:100%;max-width:440px;max-height:520px;object-fit:contain;margin:14px auto;border-radius:12px;background:#eee}.bookhint{padding:12px;border-radius:12px;background:#30465a;margin:12px 0}.bookhint img{width:100%;border-radius:8px}.import-status{min-height:24px}.book-step{background:#26384b;padding:12px;border-radius:12px;margin:10px 0}nav button{background:transparent;color:#c3cbd6;padding:10px 5px;font-size:11px}nav button.active{color:#e4c78b} .progress{height:8px;background:#33475a;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:#d5b779} .feedback{margin-top:15px;padding:12px;border-radius:12px;background:#2b3c4c} .hintbox{background:#33475b;padding:14px;border-radius:12px;margin-top:12px}.subtle{background:transparent;color:#e4c78b;border:1px solid #61738a}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choices button{background:#31465d;color:#fff}.tag{display:inline-block;border:1px solid #61738a;border-radius:20px;padding:5px 10px;font-size:12px;color:#cbd6e2}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.panel button{max-width:100%}select.answer{min-width:0}.card.mini{transform:scale(.8);margin:-4px auto} </style><style id="mobile-quiz-fixes">input,select,textarea{font-size:16px!important}.place-quiz h1{font-size:22px;margin:6px 0}.place-quiz .panel{margin-top:10px;padding:12px}.place-quiz .panel h2{font-size:18px;margin:3px 0 12px}.place-quiz .memory-art{max-height:230px;margin:8px auto}.place-quiz .choices{gap:7px}.place-quiz .choices button{padding:11px 8px;min-height:45px}.place-quiz .feedback{margin-top:9px;padding:10px}.place-quiz .muted.small{margin:7px 0}.place-quiz:has(.place-next){padding-bottom:85px}.place-next{position:fixed;z-index:30;bottom:calc(58px + env(safe-area-inset-bottom));left:0;right:0;padding:9px 18px;background:linear-gradient(transparent,#101b28 20%);display:flex;justify-content:center}.place-next button{width:100%;max-width:484px;box-shadow:0 4px 16px #0008}nav{z-index:20}.place-quiz .sectionhead button{padding:9px;font-size:13px}.place-quiz .sectionhead{align-items:center}@media(max-height:720px){.place-quiz .memory-art{max-height:175px}.place-quiz .choices button{padding:9px 6px}}</style></head><body><main><header><span class="pill">♠ MNEMONICA COACH</span><span id="headProgress" class="muted small"></span></header><section id="screen"></section></main><nav><button data-nav="home" class="active">⌂ Start</button><button data-nav="course">◎ Lernkurs</button><button data-nav="stack">▦ Stapel</button><button data-nav="palace">▧ Bilder</button><button data-nav="stats">◉ Fortschritt</button></nav><script>
const raw='4C 2H 7D 3C 4H 6D AS 5H 9S 2S QH 3D QC 8H 6S 5S 9H KC 2D JH 3S 8S 6H TC 5D KD 2C 3H 8D 5C KS JD 8C TS KH JC 7S TH AD 4S 7H 4D AC 9C JS QD 7C QS TD 6C AH 9D'.split(' ');
const suit={C:'♣',D:'♦',H:'♥',S:'♠'},names={C:'Kreuz',D:'Karo',H:'Herz',S:'Pik'},ranks={A:'Ass',K:'König',Q:'Dame',J:'Bube',T:'10'};
const cards=raw.map((id,i)=>({id,pos:i+1,s:id.slice(-1),r:id.slice(0,-1),name:names[id.slice(-1)]+' '+(ranks[id.slice(0,-1)]||id.slice(0,-1))}));
const key='mnemonica-coach-v1';let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}
state=state||{};state.unlocked=Math.min(52,Math.max(5,Number(state.unlocked)||5));state.records=state.records||{};state.notes=state.notes||{};state.history=state.history||[];state.sessions=state.sessions||0;
let page='home',phase='intro',queue=[],idx=0,current=null,dir='position',result=null,sessionAnswers=0,sessionCorrect=0,mode='guided',hintVisible=false,answerVisible=false,startedAt=0,sessionErrors=[];
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(state)),rec=c=>state.records[c.id]||{right:0,wrong:0,streak:0,due:0},mastered=c=>{let r=rec(c);return r.streak>=3&&r.right>=4},known=()=>cards.slice(0,state.unlocked).filter(mastered).length;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function cardHtml(c){return `<div class="card ${'DH'.includes(c.s)?'red':''}"><div class="corner">${c.r==='T'?'10':c.r} ${suit[c.s]}</div><div class="center">${suit[c.s]}</div><div class="corner" style="text-align:right">${c.r==='T'?'10':c.r} ${suit[c.s]}</div></div>`}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hint(c){let n=state.notes[c.id];return n?`💡 Deine Merkhilfe: ${escapeHtml(n)}`:'💡 Erfinde ein auffälliges Bild, das die Zahl '+c.pos+' mit '+escapeHtml(c.name)+' verbindet. Du kannst deine Merkhilfe unter „Stapel“ speichern.'}
function home(){let k=known(),due=cards.slice(0,state.unlocked).filter(c=>rec(c).due<=Date.now()).length;return `<h1>Dein Kartengedächtnis 🃏</h1><p class="muted">In kleinen Gruppen lernen. Durcheinander abfragen. Sicher erinnern.</p><div class="panel"><div class="stat"><div><strong>${state.unlocked}/52</strong><span class="small">Freigeschaltet</span></div><div><strong>${k}</strong><span class="small">Gefestigt</span></div><div><strong>${due}</strong><span class="small">Zum Üben</span></div></div><h2>Dein Lernplan</h2><p class="muted">Erst fünf Karten ansehen, dann gemischt in beide Richtungen üben – mit optionalen Hinweisen.</p><div class="actions"><button id="start">5 Karten lernen</button><button id="practice" class="secondary">Alle üben</button></div><p class="small muted">Fortschritt bleibt in diesem Browser gespeichert.</p></div><div class="panel"><h2>Training</h2><div class="actions"><button id="guided" class="secondary">Mit Hilfen</button><button id="fast" class="secondary">Ohne Hilfen</button></div><p class="small muted">In jeder Runde werden die Karten gemischt. Beide Abfragerichtungen kommen vor.</p></div><div class="panel"><h2>Nächste Lernportion</h2><p>Karten 1–${state.unlocked} freigeschaltet.</p><div class="progress"><div style="width:${k/state.unlocked*100}%"></div></div><p class="small muted">${k} von ${state.unlocked} gefestigt.</p><button id="expand" class="secondary" ${state.unlocked>=52?'disabled':''}>Nächste 5 Karten hinzufügen</button></div>`}
function start(){page='learn';phase='intro';mode='guided';idx=0;queue=cards.slice(Math.max(0,state.unlocked-5),state.unlocked);sessionAnswers=0;sessionCorrect=0;render()}
function training(chosen='guided',pool){page='learn';mode=chosen;phase='quiz';sessionAnswers=0;sessionCorrect=0;sessionErrors=[];startedAt=Date.now();let eligible=pool||cards.slice(0,state.unlocked);let due=eligible.filter(c=>rec(c).due<=Date.now());let selected=shuffle(due.length?due:eligible).slice(0,Math.min(12,eligible.length));queue=shuffle(selected.flatMap(c=>[{card:c,dir:'position'},{card:c,dir:'card'}]));idx=0;next()}
function next(){result=null;hintVisible=false;answerVisible=false;if(idx>=queue.length){phase='done';state.sessions++;save();render();return}current=queue[idx].card;dir=queue[idx].dir;phase='quiz';render()}
function record(ok){let r=rec(current);r.right+=ok?1:0;r.wrong+=ok?0:1;r.streak=ok?r.streak+1:0;let intervals=[0,1,3,7,14,30];r.due=Date.now()+(ok?intervals[Math.min(r.streak,5)]*86400000:0);state.records[current.id]=r;state.history.push({date:new Date().toISOString(),id:current.id,ok});sessionAnswers++;if(ok)sessionCorrect++;else sessionErrors.push(current.id);save()}
function quizHtml(){let progress=`<p class="muted small">Frage ${idx+1} von ${queue.length} · ${mode==='guided'?'Mit Hilfen':'Ohne Hilfen'}</p><div class="progress"><div style="width:${idx/queue.length*100}%"></div></div>`;
let q=dir==='position'?`<div class="question">Auf welcher Position liegt diese Karte?</div>${cardHtml(current)}<input id="entry" class="answer" inputmode="numeric" type="number" min="1" max="52" placeholder="Position 1–52" autocomplete="off"><p><button id="check" style="width:100%">Prüfen</button></p>`:`<div class="question">Welche Karte liegt auf Position</div><div class="number">${current.pos}?</div><div class="actions"><select id="rank" class="answer" style="flex:1"><option value="">Wert wählen</option>${['A','2','3','4','5','6','7','8','9','T','J','Q','K'].map(v=>`<option value="${v}">${ranks[v]||v}</option>`).join('')}</select><select id="suit" class="answer" style="flex:1"><option value="">Farbe wählen</option>${Object.keys(suit).map(v=>`<option value="${v}">${names[v]} ${suit[v]}</option>`).join('')}</select></div><p><button id="check" style="width:100%">Prüfen</button></p>`;
if(result!==null){q=`<div class="question ${result?'good':'bad'}">${result?'Richtig! ✓':'Noch nicht ganz'}</div>${cardHtml(current)}<p style="text-align:center">Position <b>${current.pos}</b> · ${current.name}</p><div class="feedback">${hint(current)}</div><p><button id="next" style="width:100%">${idx+1===queue.length?'Ergebnis ansehen':'Nächste Frage'}</button></p>`}
else if(mode==='guided'){q+=`<button id="showHint" class="subtle" style="width:100%">${hintVisible?'Hinweis ausblenden':'💡 Hinweis anzeigen'}</button>${hintVisible?`<div class="hintbox">${hint(current)}</div>`:''}`}
return progress+q}
function learn(){if(phase==='intro'){let c=queue[idx];return `<h1>Neue Karten entdecken</h1><p class="muted">Präge dir die Verbindung von Position und Karte ein. Danach werden die Karten gemischt abgefragt.</p><p class="small muted">Karte ${idx+1} von ${queue.length}</p>${cardHtml(c)}<div class="question">Position ${c.pos}</div><p style="text-align:center">${c.name}</p><div class="feedback">${hint(c)}</div><p><button id="introNext" style="width:100%">${idx+1===queue.length?'Gemischte Abfrage starten':'Nächste Karte'}</button></p>`}
if(phase==='done'){let missed=[...new Set(sessionErrors)].map(id=>cards.find(c=>c.id===id));return `<h1>Training geschafft! 🎉</h1><div class="panel"><div class="number">${sessionCorrect}/${sessionAnswers}</div><p style="text-align:center">Richtige Antworten</p>${missed.length?`<p class="muted">Diese Karten solltest du noch einmal üben: ${missed.map(c=>c.pos+'. '+c.name).join(', ')}.</p><button id="retry" style="width:100%">Fehler gezielt wiederholen</button>`:'<p class="good">Super! In dieser Runde war alles richtig.</p>'}<p><button id="again" class="secondary" style="width:100%">Neue gemischte Runde</button></p></div>`}return `<h1>Gedächtnistraining</h1>${quizHtml()}`}
function stack(){return `<h1>Der komplette Stack</h1><p class="muted">Tippe auf eine Karte, um deine persönliche Eselsbrücke zu speichern.</p><div class="stack">${cards.map(c=>`<div data-card="${c.pos}" style="cursor:pointer"><b>${c.pos}.</b> <span class="${'DH'.includes(c.s)?'bad':''}">${c.r==='T'?'10':c.r}${suit[c.s]}</span> ${c.name} ${state.notes[c.id]?'💡':''}</div>`).join('')}</div><div id="notePanel"></div>`}
function stats(){let h=state.history,correct=h.filter(x=>x.ok).length;return `<h1>Dein Fortschritt</h1><div class="panel stat"><div><strong>${h.length}</strong><span class="small">Antworten</span></div><div><strong>${h.length?Math.round(correct/h.length*100):0}%</strong><span class="small">Trefferquote</span></div><div><strong>${state.sessions}</strong><span class="small">Trainings</span></div></div><div class="panel"><h2>Was du schon kannst</h2><p>${known()} Karten sind gefestigt. Du trainierst aktuell ${state.unlocked} Karten.</p></div><div class="panel"><h2>Datensicherung</h2><button id="export" class="secondary">Lernstand sichern (JSON)</button><p class="small muted">Die Daten liegen nur in diesem Browser. Sichere sie gelegentlich, bevor du Browserdaten löschst.</p><button id="import" class="secondary">Lernstand wiederherstellen</button><input id="importFile" type="file" accept="application/json,.json" hidden><p><button id="reset" class="secondary">Lernstand zurücksetzen</button></p></div>`}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));$('headProgress').textContent=`${known()} gefestigt`;$('screen').innerHTML=page==='home'?home():page==='learn'?learn():page==='stack'?stack():stats();bind()}
function bind(){const b=id=>$(id);if(b('start'))b('start').onclick=start;if(b('practice'))b('practice').onclick=()=>training('guided');if(b('guided'))b('guided').onclick=()=>training('guided');if(b('fast'))b('fast').onclick=()=>training('fast');if(b('expand'))b('expand').onclick=()=>{state.unlocked=Math.min(52,state.unlocked+5);save();start()};if(b('introNext'))b('introNext').onclick=()=>{idx++;if(idx>=queue.length)training('guided',queue);else render()};if(b('showHint'))b('showHint').onclick=()=>{hintVisible=!hintVisible;render()};if(b('check')){b('check').onclick=()=>{let v=dir==='position'?b('entry').value.trim():b('rank').value+b('suit').value;if(!v||dir==='card'&&(!b('rank').value||!b('suit').value))return;result=dir==='position'?Number(v)===current.pos:v===current.id;record(result);render()};if(b('entry'))b('entry').onkeydown=e=>{if(e.key==='Enter')b('check').click()}}if(b('next'))b('next').onclick=()=>{idx++;next()};if(b('again'))b('again').onclick=()=>training(mode);if(b('retry'))b('retry').onclick=()=>training(mode,[...new Set(sessionErrors)].map(id=>cards.find(c=>c.id===id)));if(b('reset'))b('reset').onclick=()=>{if(confirm('Wirklich den gesamten Lernfortschritt löschen?')){localStorage.removeItem(key);location.reload()}};if(b('export'))b('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='mnemonica-lernstand.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};if(b('import'))b('import').onclick=()=>b('importFile').click();if(b('importFile'))b('importFile').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!obj||!obj.records||!obj.notes||!Array.isArray(obj.history))throw Error('Ungültige Sicherungsdatei');if(confirm('Aktuellen Lernstand durch diese Sicherung ersetzen?')){localStorage.setItem(key,JSON.stringify(obj));location.reload()}}catch(err){alert('Sicherung konnte nicht gelesen werden: '+err.message)}};document.querySelectorAll('[data-card]').forEach(el=>el.onclick=()=>{let c=cards[Number(el.dataset.card)-1];$('notePanel').innerHTML=`<div class="panel"><h2>${c.pos}. ${c.name}</h2><p class="muted">Deine persönliche Merkhilfe</p><textarea id="noteText">${escapeHtml(state.notes[c.id]||'')}</textarea><p><button id="saveNote">Speichern</button></p></div>`;$('saveNote').onclick=()=>{state.notes[c.id]=$('noteText').value;save();render()};$('notePanel').scrollIntoView({behavior:'smooth',block:'nearest'})})}

// Memory Arts integration: the original illustrations never leave the user's browser.
const bookStops=['Turm','Schwan','Berge','Steinhand','Wasserfall','Strudel','Giraffe','Kopfloser Schneemann','Tunnel','Baumeule','Säulen','Ringmeister und Löwe','Schmetterling','Wüstensegelboot','Schlangen','Winde','Versteinerter Baumstumpf','Wolken','Wüsteninsel','Pfau','Geisterpferd','Hahnenkampf','Pegasus','Elefant','Knorriger Baum','Konquistador'];
let palaceImages={},plainImages={},imageDB=null,bookShowHint=false;
const stopNo=c=>Math.ceil(c.pos/2);
function stopCards(n){return cards.slice((n-1)*2,n*2)}
function bookImg(n){return palaceImages[n]?`<img class="memory-art" src="${palaceImages[n]}" alt="Originalillustration Gedächtnisort ${n}">`:`<div class="book-step muted">Für Gedächtnisort ${n} ist noch kein Bild importiert. Unter „Bilder“ kannst du die PDF lokal einlesen.</div>`}
function plainImg(n){return plainImages[n]?`<img class="memory-art" src="${plainImages[n]}" alt="Original-Ortsillustration ${n} mit Bildunterschrift">`:`<div class="book-step muted">Das reine Ortsbild fehlt noch. Bitte unter „Bilder“ deine PDF erneut importieren, damit auch die Seiten 21–46 gespeichert werden.</div>`}
function bookContext(c){let n=stopNo(c),pair=stopCards(n);return `<div class="bookhint"><b>Gedächtnisort ${n}${bookStops[n-1]?' · '+bookStops[n-1]:''}</b><p class="small">Das Buch nutzt 26 Orte mit je zwei Karten. Hier gehören Position ${pair[0].pos} (${pair[0].name}) und ${pair[1].pos} (${pair[1].name}) zusammen.</p>${bookImg(n)}<p class="small muted">Betrachte die Szene und erzähle dir die Verbindung zwischen Ort, Bilddetails und den beiden Karten. Danach versuche den Abruf ohne Bild.</p></div>`}
function palace(){return `<h1>Dein Bilderpfad 🧠</h1><p class="muted">Die Originalillustrationen aus <i>The Memory Arts – Mnemonica Special Edition</i> kannst du direkt aus deiner PDF importieren. Die Datei und Bilder werden nicht auf GitHub hochgeladen.</p><div class="panel"><h2>Originalbilder lokal einlesen</h2><p>Wähle deine PDF <b>the-memory-arts.pdf</b>. Die App liest die 26 reinen Ortsbilder mit ihren Bildunterschriften (PDF-Seiten 21–46) <b>und</b> die 26 späteren Kartenbilder (PDF-Seiten 59–84) ein. Alles bleibt auf diesem Gerät.</p><input id="pdfInput" type="file" accept="application/pdf,.pdf" style="max-width:100%"><p id="importStatus" class="small muted import-status">${Object.keys(palaceImages).length} von 26 Bildern verfügbar.</p><p class="small muted">Hinweis: Der erste Import braucht Internet, um den PDF-Leser zu laden. Für die Nutzung auf dem iPhone musst du die PDF dort einmal ebenfalls importieren. Bilder sind nicht Teil der JSON-Lernstandsicherung.</p></div><div class="panel"><h2>Dein Gedächtnispalast</h2>${Array.from({length:26},(_,i)=>{let n=i+1,a=stopCards(n);return `<div class="book-step"><b>Ort ${n}${bookStops[i]?' · '+bookStops[i]:''}</b><p class="small">${a[0].pos}: ${a[0].name} · ${a[1].pos}: ${a[1].name}</p><button class="secondary" data-stop="${n}">${palaceImages[n]?'Bild ansehen':'Bild fehlt'}</button></div>`}).join('')}</div><div id="stopPreview"></div>`}
function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open('mnemonica-originalbilder-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('images');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function loadSavedImages(){try{imageDB=await openDB();let tx=imageDB.transaction('images','readonly');let store=tx.objectStore('images');for(let n=1;n<=26;n++){for(const [key,target] of [[n,palaceImages],[100+n,plainImages]]){let req=store.get(key);req.onsuccess=()=>{if(req.result){target[n]=req.result;if(page==='palace'||page==='course')render()}}}}}catch(e){console.warn('Bildspeicher nicht verfügbar',e)}}
function putImage(n,url){return new Promise((resolve,reject)=>{let tx=imageDB.transaction('images','readwrite');tx.objectStore('images').put(url,n);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function loadPDFJS(){return new Promise((resolve,reject)=>{if(window.pdfjsLib)return resolve();let t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';t.onload=()=>resolve();t.onerror=()=>reject(new Error('PDF-Lesebibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.'));document.head.appendChild(t)})}
async function importBook(file){let status=$('importStatus');if(!file)return;try{if(!imageDB)imageDB=await openDB();status.textContent='PDF-Leser wird geladen …';await loadPDFJS();pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';let data=await file.arrayBuffer();let pdf=await pdfjsLib.getDocument({data:new Uint8Array(data)}).promise;if(pdf.numPages<84)throw new Error('Die ausgewählte PDF hat weniger als 84 Seiten. Bitte die richtige Ausgabe auswählen.');for(let k=0;k<2;k++)for(let n=1;n<=26;n++){status.textContent=`${k===0?"Ortsbild":"Kartenbild"} ${n} von 26 wird lokal gespeichert …`;let pg=await pdf.getPage(k===0?20+n:58+n);let viewport=pg.getViewport({scale:1});let scale=Math.min(1.2,850/viewport.width);viewport=pg.getViewport({scale});let canvas=document.createElement('canvas');canvas.width=Math.round(viewport.width);canvas.height=Math.round(viewport.height);await pg.render({canvasContext:canvas.getContext('2d'),viewport}).promise;let url=canvas.toDataURL('image/jpeg',0.78);await putImage(k===0?100+n:n,url);(k===0?plainImages:palaceImages)[n]=url;pg.cleanup()}status.textContent='Alle 26 Ortsbilder und 26 Kartenbilder wurden gespeichert ✓';setTimeout(()=>{if(page==='palace')render()},1400)}catch(e){status.textContent='Import nicht möglich: '+e.message}}

function courseHome(){let ready=courseState.passed===26;return `<h1>Dein Lernkurs 🧠</h1><p class="muted">Zuerst lernst du die Sprache der Bilder. Erst danach beginnen wir mit dem Kartenstapel.</p><div class="panel"><span class="pill">PHASE 1 · GEDÄCHTNISREISE</span><h2>Die 26 Orte und ihre Geschichten kennenlernen</h2><p>Jedes der 26 Bilder ist eine Station deiner Reise. An jeder Station werden später zwei Spielkarten verankert. Zunächst lernst du <b>nur die Orte, ihre Bildunterschriften und die Reihenfolge</b>.</p><div class="progress"><div style="width:${Math.round(courseState.passed/26*100)}%"></div></div><p class="small muted">${courseState.passed} von 26 Orten in Reihenfolge geübt</p><button id="courseStart" style="width:100%">${courseState.passed?'Reise fortsetzen':'Mit Ort 1 beginnen'}</button></div><div class="panel"><span class="pill">PHASE 2 · BILDERSCHLÜSSEL</span><h2>Was bedeuten die Details?</h2><p>Der <b>Ort</b> sagt dir, wo du dich befindest. Einzelne <b>Gegenstände und Figuren</b> helfen später beim Erkennen von Kartenwert und Farbe.</p><p>Beispiel aus dem Buch: <b>Tür → 4</b>, <b>Engel → 7</b>. Das allein bestimmt noch keine komplette Spielkarte.</p><button id="courseKeyBtn" class="secondary" style="width:100%">Bilderschlüssel verstehen</button></div><div class="panel"><span class="pill">PHASE 3 · MNEMONICA</span><h2>Erst dann die Karten</h2><p>Wenn du die Reise und den vollständigen Bilderschlüssel sicher beherrschst, verknüpfen wir die 52 Karten mit den Bildern und trainieren den direkten Abruf.</p><p class="small muted">Der vollständige Bilderschlüssel wurde noch nicht zuverlässig aus den eingescannten Buchseiten übertragen. Diese Phase ist daher bewusst noch keine geführte Entschlüsselung.</p><button id="courseCards" class="secondary" style="width:100%">Vorhandenes Kartentraining öffnen</button></div>`}

function showPlaceCaption(n){
 const box=$('captionArea'),out=$('captionImage');if(!box||!out||!plainImages[n])return;
 if(!box.classList.contains('hidden')){box.classList.add('hidden');$('captionZoom').textContent='📖 Bildunterschrift groß anzeigen';return}
 const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const y=Math.floor(im.naturalHeight*.77);c.width=im.naturalWidth;c.height=im.naturalHeight-y;const ctx=c.getContext('2d');ctx.drawImage(im,0,y,im.naturalWidth,c.height,0,0,c.width,c.height);out.src=c.toDataURL('image/png');box.classList.remove('hidden');$('captionZoom').textContent='Bildunterschrift schließen'};im.src=plainImages[n];
}
const placeStages=[[1,5],[6,10],[11,15],[16,20],[21,25],[26,26]];
courseState.mastered=Math.max(0,Math.min(6,Number(courseState.mastered)||0));
courseState.attempts=courseState.attempts||[];
let placeSession=null,placeFeedback=null,placeAnswer=null,placeShow=false;
const placeStage=()=>Math.min(5,courseState.mastered);
const placeRange=(st)=>Array.from({length:placeStages[st][1]-placeStages[st][0]+1},(_,i)=>placeStages[st][0]+i);
const placeLabel=n=>bookStops[n-1];
function placeQuestion(n,type,scope){
 let correct,stem,illustration='';
 if(type==='number'){stem=`Welcher Ort ist Station ${n}?`;correct=placeLabel(n)}
 if(type==='position'){stem=`Welche Nummer hat der Ort „${placeLabel(n)}“?`;correct=String(n)}
 if(type==='next'){stem=`Welcher Ort folgt direkt auf „${placeLabel(n)}“?`;correct=placeLabel(n+1)}
 if(type==='previous'){stem=`Welcher Ort liegt direkt vor „${placeLabel(n)}“?`;correct=placeLabel(n-1)}
 if(type==='picture'){stem='Welche Station zeigt diese Illustration?';correct=String(n);illustration=plainImages[n]?`<canvas class="memory-art" data-quiz-place="${n}" aria-label="Illustration ohne Ortsnummer und Bildunterschrift" style="max-height:310px"></canvas>`:'';if(!illustration)return placeQuestion(n,'number',scope)}
 let isNum=type==='position'||type==='picture';
 let candidates=isNum?scope.map(String):scope.map(placeLabel);
 if(type==='next'||type==='previous')candidates=Array.from(new Set([...scope.map(placeLabel),placeLabel(n+ (type==='next'?1:-1))]));
 let options=shuffle([correct,...shuffle(candidates.filter(x=>x!==correct)).slice(0,3)]);
 // Immer vier Optionen, auch bei der einzelnen letzten Station.
 let all=isNum?Array.from({length:26},(_,i)=>String(i+1)):bookStops;
 for(let v of shuffle(all))if(options.length<4&&!options.includes(v))options.push(v);
 return {n,type,stem,correct,illustration,options:shuffle(options)};
}
function makePlaceExam(st){
 let focus=placeRange(st),all=Array.from({length:placeStages[st][1]},(_,i)=>i+1),questions=[];
 // Jeder neue Ort wird in mehreren Richtungen getestet; ältere Orte bleiben Teil der Prüfung.
 for(let n of focus){
  questions.push(placeQuestion(n,'number',all));
  questions.push(placeQuestion(n,'position',all));
  questions.push(placeQuestion(n,'picture',all));
  let adjacent=[];
  if(n>1)adjacent.push('previous');
  if(n<placeStages[st][1])adjacent.push('next');
  questions.push(placeQuestion(n,adjacent.length?shuffle(adjacent)[0]:'number',all));
 }
 if(st>0){let older=shuffle(all.filter(n=>!focus.includes(n))).slice(0,Math.min(5,focus.length+1));for(let n of older)questions.push(placeQuestion(n,shuffle(['number','position','picture'])[0],all))}
 return shuffle(questions);
}
function beginPlaceExam(){let st=placeStage();placeSession={st,questions:makePlaceExam(st),idx:0,correct:0,per:{},miss:[]};placeFeedback=null;courseView='exam';render()}
function placeCheck(value){if(!placeSession||placeFeedback)return;let q=placeSession.questions[placeSession.idx],ok=value===q.correct;placeFeedback={ok,correct:q.correct};placeSession.per[q.n]=placeSession.per[q.n]||{right:0,total:0};placeSession.per[q.n].total++;if(ok){placeSession.correct++;placeSession.per[q.n].right++}else placeSession.miss.push(q.n);render()}
function placeAdvance(){if(!placeSession)return;placeSession.idx++;placeFeedback=null;if(placeSession.idx>=placeSession.questions.length){let s=placeSession,focus=placeRange(s.st),pct=s.correct/s.questions.length;let mastered=pct>=.9&&focus.every(n=>(s.per[n]?.right||0)>=2);s.passed=mastered;courseState.attempts.push({stage:s.st,date:new Date().toISOString(),correct:s.correct,total:s.questions.length,passed:mastered});if(mastered){courseState.mastered=Math.max(courseState.mastered,s.st+1);courseState.passed=Math.max(courseState.passed||0,placeStages[s.st][1]);}saveCourse();courseView='examDone'}render()}
courseHome=function(){let st=placeStage(),complete=courseState.mastered===6,focus=complete?[]:placeRange(st);return `<h1>Deine Gedächtnisreise 🧠</h1><p class="muted">Erst die Orte und ihre Geschichten – Karten kommen später.</p><div class="panel"><span class="pill">${complete?'ALLE ETAPPEN GESCHAFFT':'ETAPPE '+(st+1)+' VON 6'}</span><h2>${complete?'26 Orte freigeschaltet':`Orte ${focus[0]}–${focus.at(-1)} lernen`}</h2><div class="progress"><div style="width:${courseState.mastered/6*100}%"></div></div><p class="small muted">${courseState.mastered} von 6 Etappen bestanden · ${courseState.mastered?placeStages[courseState.mastered-1][1]:0} von 26 Orten freigeschaltet</p>${complete?'<p class="good">Die gesamte Reise ist freigeschaltet. Wiederhole sie regelmäßig!</p>':`<p>Präge dir zuerst die Bilder und Texte ein. Die Prüfung mischt Ortsnummern, Namen, Bilder sowie vorherige und nächste Stationen.</p><div class="actions"><button id="placeLearn">Orte lernen</button><button id="placeExam">Gemischt prüfen</button></div><p class="small muted">Zum Bestehen: mindestens 90 % richtig und jeder neue Ort mindestens zweimal richtig. Bei Fehlern bleibt die Etappe offen.</p>`}<p><button id="placeReview" class="secondary" style="width:100%">${complete?'Alle Orte wiederholen':'Bisherige Orte wiederholen'}</button></p></div><div class="panel"><h2>Dein Weg</h2>${placeStages.map((a,i)=>`<div class="book-step">${i<courseState.mastered?'✓':i===st?'➜':'🔒'} Etappe ${i+1}: Orte ${a[0]}–${a[1]} ${i===st&&!complete?'· aktuell':''}</div>`).join('')}</div><div class="panel"><h2>Später: Bilderschlüssel und Karten</h2><p>Wenn du die 26 Orte beherrschst, folgen die Symbolregeln und das eigentliche Kartentraining.</p><button id="courseKeyBtn" class="secondary">Bilderschlüssel ansehen</button></div>`};
courseLesson=function(){let n=courseStop,st=placeStage(),allowed=courseState.mastered===6?26:placeStages[st][1],min=courseState.mastered===6?1:placeStages[st][0];return `<h1>Ort ${n} · ${escapeHtml(placeLabel(n))}</h1><p class="muted">${courseState.mastered===6?'Gesamte Reise':`Etappe ${st+1}: Orte ${min}–${allowed}`} · Nur Orte und Geschichten</p><div class="panel">${courseReveal?`<div class="book-step"><b>Ohne Bild:</b> Stelle dir „${escapeHtml(placeLabel(n))}“ und die Geschichte unter der Illustration vor.</div><button id="courseShow" class="secondary" style="width:100%">Bild und Geschichte aufdecken</button>`:plainImg(n)+`<button id="courseHide" class="secondary" style="width:100%">Bild ausblenden und erinnern</button>`}<p>Lies den Text unter dem Bild und erzähle die Szene anschließend ohne Vorlage nach.</p>${!courseReveal&&plainImages[n]?`<button id="captionZoom" class="secondary" style="width:100%">📖 Bildunterschrift groß anzeigen</button><div id="captionArea" class="hidden" style="margin-top:12px"><p class="small muted">Originaltext aus deiner PDF, vergrößert zum Lesen:</p><img id="captionImage" style="width:100%;border-radius:12px;background:#eee" alt="Vergrößerte Original-Bildunterschrift"></div>`:''}<p class="small muted">Der Originaltext ist Englisch. Du kannst dir darunter deine eigene deutsche Kurzfassung notieren.</p><textarea id="placeNote" placeholder="Deine persönliche Merkhilfe (optional)">${escapeHtml(localStorage.getItem('mnemonica-place-'+n)||'')}</textarea><div class="actions"><button id="coursePrev" class="secondary" ${n<=min?'disabled':''}>← Vorheriger</button><button id="courseNext">${n>=allowed?'Zur Etappe':'Nächster Ort →'}</button></div><p><button id="courseBack" class="subtle" style="width:100%">Zur Übersicht</button></p></div>`};
function placeExamHtml(){let s=placeSession,q=s.questions[s.idx],pct=Math.round(s.idx/s.questions.length*100);return `<h1>Gemischte Ortsprüfung</h1><p class="muted">Frage ${s.idx+1} von ${s.questions.length} · Etappe ${s.st+1}</p><div class="progress"><div style="width:${pct}%"></div></div><div class="panel"><h2>${escapeHtml(q.stem)}</h2>${q.illustration}<div class="choices">${q.options.map((v,i)=>`<button data-place-answer="${i}" ${placeFeedback?'disabled':''}>${escapeHtml(v)}</button>`).join('')}</div>${placeFeedback?`<div class="feedback ${placeFeedback.ok?'good':'bad'}">${placeFeedback.ok?'✓ Richtig!':'✗ Noch nicht.'} Antwort: <b>${escapeHtml(placeFeedback.correct)}</b></div><p><button id="placeContinue" style="width:100%">${s.idx+1===s.questions.length?'Ergebnis ansehen':'Nächste Frage →'}</button></p>`:''}</div>`}
function placeExamDone(){let s=placeSession,pct=Math.round(s.correct/s.questions.length*100),focus=placeRange(s.st),weak=focus.filter(n=>(s.per[n]?.right||0)<2);return `<h1>${s.passed?'Etappe bestanden! 🎉':'Weiter üben 💪'}</h1><div class="panel"><div class="number">${pct}%</div><p style="text-align:center">${s.correct} von ${s.questions.length} richtig</p>${s.passed?`<p class="good">Die nächsten Orte sind freigeschaltet.</p>`:`<p>Für die Freischaltung brauchst du mindestens 90 % und pro neuem Ort zwei richtige Antworten.</p>${weak.length?`<p>Besonders wiederholen: ${weak.map(n=>`${n} · ${escapeHtml(placeLabel(n))}`).join(', ')}.</p>`:''}`}<div class="actions"><button id="placeAgain">${s.passed?'Zur nächsten Etappe':'Erneut prüfen'}</button><button id="placeGoLearn" class="secondary">Orte ansehen</button></div></div>`}

function paintQuizPlaceImage(){
 const canvas=document.querySelector('canvas[data-quiz-place]');
 if(!canvas)return;
 const n=Number(canvas.dataset.quizPlace),src=plainImages[n];
 if(!src)return;
 const img=new Image();
 img.onload=()=>{
  if(!canvas.isConnected||Number(canvas.dataset.quizPlace)!==n)return;
  // Bei den Ortsseiten aus der PDF liegt das eingerahmte Motiv
  // ungefähr zwischen 25 % und 79 % der Seitenhöhe.
  const top=Math.round(img.naturalHeight*.255);
  const bottom=Math.round(img.naturalHeight*.785);
  const height=Math.max(1,bottom-top);
  canvas.width=img.naturalWidth;
  canvas.height=height;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(img,0,top,img.naturalWidth,height,0,0,canvas.width,canvas.height);
 };
 img.src=src;
}
const quizImageBind=bind;
bind=function(){quizImageBind();if(page==='course'&&courseView==='exam')paintQuizPlaceImage()};
document.addEventListener('click',e=>{if(e.target&&e.target.id==='captionZoom')showPlaceCaption(courseStop)});
// Mnemonica Coach: freiwilliges Ortetraining und kompakte mobile Prüfung.
let freePlaceConfig={range:'all',kind:'mixed',count:20};
const learnedPlaceMax=()=>courseState.mastered>=6?26:courseState.mastered?placeStages[courseState.mastered-1][1]:0;
function freePlacePool(){let max=learnedPlaceMax(),v=freePlaceConfig.range;if(v==='all')return Array.from({length:max},(_,i)=>i+1);let [a,b]=v.split('-').map(Number);return Array.from({length:Math.max(0,Math.min(max,b)-a+1)},(_,i)=>a+i)}
function freePlaceQuestions(){let pool=freePlacePool(),types=freePlaceConfig.kind==='mixed'?['number','position','picture','next','previous']:[freePlaceConfig.kind],questions=[],count=Number(freePlaceConfig.count)||20;
 // Round-robin through all selected places before repeating any place.
 while(questions.length<count){for(let n of shuffle(pool)){if(questions.length>=count)break;let valid=types.filter(t=>t!=='next'||n<learnedPlaceMax()).filter(t=>t!=='previous'||n>1);if(!valid.length)valid=['number'];let type=valid[(questions.length+Math.floor(questions.length/pool.length))%valid.length];questions.push(placeQuestion(n,type,pool))}}
 return questions;
}
function beginFreePlaceTraining(){let pool=freePlacePool();if(!pool.length)return;placeSession={free:true,st:placeStage(),questions:freePlaceQuestions(),idx:0,correct:0,per:{},miss:[]};placeFeedback=null;courseView='exam';render();window.scrollTo(0,0)}
function freePlaceSetup(){let max=learnedPlaceMax(),ranges=placeStages.map(([a,b])=>({a,b})).filter(x=>x.b<=max);return `<h1>Freies Ortetraining 🧠</h1><p class="muted">Übe bereits bestandene Orte – ohne neue Orte freizuschalten.</p><div class="panel"><label for="freeRange">Welche Orte?</label><select id="freeRange" class="answer"><option value="all">Alle gelernten Orte (1–${max})</option>${ranges.map(({a,b})=>`<option value="${a}-${b}" ${freePlaceConfig.range===`${a}-${b}`?'selected':''}>Orte ${a}–${b}</option>`).join('')}</select><p><label for="freeKind">Fragenart</label></p><select id="freeKind" class="answer">${[['mixed','Alles gemischt'],['number','Nummer → Ort'],['position','Ort → Nummer'],['picture','Bilder erkennen'],['next','Nächster Ort'],['previous','Vorheriger Ort']].map(([v,t])=>`<option value="${v}" ${freePlaceConfig.kind===v?'selected':''}>${t}</option>`).join('')}</select><p><label for="freeCount">Anzahl der Fragen</label></p><select id="freeCount" class="answer">${[10,20,30].map(n=>`<option value="${n}" ${freePlaceConfig.count===n?'selected':''}>${n} Fragen</option>`).join('')}</select><p><button id="freeStart" style="width:100%">Training starten</button></p><button id="freeBack" class="secondary" style="width:100%">Zur Übersicht</button></div>`}
const originalCourseHomeForFree=courseHome;
courseHome=function(){let html=originalCourseHomeForFree();let max=learnedPlaceMax();let block=`<div class="panel"><h2>Freies Ortetraining</h2><p>Alle bereits bestandenen Orte gleichmäßig üben. Kein Freischalten, kein Prüfungsdruck.</p>${max?`<button id="freeSetup" style="width:100%">Freies Training starten (1–${max})</button>`:'<p class="muted small">Nach der ersten bestandenen Etappe verfügbar.</p>'}</div>`;return html.replace('<div class="panel"><h2>Dein Weg</h2>',block+'<div class="panel"><h2>Dein Weg</h2>')};
const previousCourseWithFree=course;
course=function(){if(courseView==='freeSetup')return freePlaceSetup();return previousCourseWithFree()};
placeExamHtml=function(){let s=placeSession,q=s.questions[s.idx],pct=Math.round(s.idx/s.questions.length*100);return `<div class="place-quiz"><div class="sectionhead"><h1>${s.free?'Freies Training':'Ortsprüfung'}</h1><button id="placeExit" class="subtle" type="button">Beenden</button></div><p class="muted small">Frage ${s.idx+1} von ${s.questions.length}${s.free?' · Ohne Freischaltung':` · Etappe ${s.st+1}`}</p><div class="progress"><div style="width:${pct}%"></div></div><div class="panel"><h2>${escapeHtml(q.stem)}</h2>${q.illustration}<div class="choices">${q.options.map((v,i)=>`<button data-place-answer="${i}" ${placeFeedback?'disabled':''}>${escapeHtml(v)}</button>`).join('')}</div>${placeFeedback?`<div class="feedback ${placeFeedback.ok?'good':'bad'}">${placeFeedback.ok?'✓ Richtig!':'✗ Noch nicht.'} Antwort: <b>${escapeHtml(placeFeedback.correct)}</b></div>`:''}</div>${placeFeedback?`<div class="place-next"><button id="placeContinue" type="button">${s.idx+1===s.questions.length?'Ergebnis ansehen':'Nächste Frage →'}</button></div>`:''}</div>`};
const oldPlaceAdvanceForFree=placeAdvance;
placeAdvance=function(){if(!placeSession)return;if(!placeSession.free){oldPlaceAdvanceForFree();window.scrollTo(0,0);return}placeSession.idx++;placeFeedback=null;if(placeSession.idx>=placeSession.questions.length){placeSession.passed=false;courseView='examDone'}render();window.scrollTo(0,0)};
const originalPlaceDoneForFree=placeExamDone;
placeExamDone=function(){if(!placeSession?.free)return originalPlaceDoneForFree();let s=placeSession,pct=Math.round(s.correct/s.questions.length*100),weak=[...new Set(s.miss)];return `<h1>Training geschafft! 🎉</h1><div class="panel"><div class="number">${pct}%</div><p style="text-align:center">${s.correct} von ${s.questions.length} richtig</p><p class="muted">Deine Freischaltungen bleiben unverändert.</p>${weak.length?`<p>Diese Orte noch einmal ansehen: ${weak.map(n=>`${n} · ${escapeHtml(placeLabel(n))}`).join(', ')}</p>`:'<p class="good">Alle Antworten richtig!</p>'}<div class="actions"><button id="freeAgain">Noch einmal üben</button><button id="freeDone" class="secondary">Zur Übersicht</button></div></div>`};
const oldFreeBind=bind;
bind=function(){oldFreeBind();const e=id=>$(id);if(e('freeSetup'))e('freeSetup').onclick=()=>{courseView='freeSetup';render();window.scrollTo(0,0)};if(e('freeBack'))e('freeBack').onclick=()=>{courseView='intro';render()};for(const [id,key] of [['freeRange','range'],['freeKind','kind'],['freeCount','count']])if(e(id))e(id).onchange=ev=>{freePlaceConfig[key]=ev.target.value};if(e('freeStart'))e('freeStart').onclick=beginFreePlaceTraining;if(e('freeAgain'))e('freeAgain').onclick=beginFreePlaceTraining;if(e('freeDone'))e('freeDone').onclick=()=>{courseView='intro';render();window.scrollTo(0,0)};if(e('placeExit'))e('placeExit').onclick=()=>{courseView='intro';placeSession=null;placeFeedback=null;render();window.scrollTo(0,0)};
 // Fixierter Weiter-Button oberhalb der iPhone-Navigation, keine automatische Weiterleitung.
};

// Adaptiver Orts-Lerncoach v2: getrennte Profile je Ort und Fragerichtung.
const coachKey='mnemonica-place-coach-v2';
let coachData;try{coachData=JSON.parse(localStorage.getItem(coachKey))||{}}catch(e){coachData={}}
if(!coachData.profiles||typeof coachData.profiles!=='object')coachData.profiles={};
if(!Array.isArray(coachData.rounds))coachData.rounds=[];
let placeQuestionShownAt=0,adaptiveActive=false;
const coachSave=()=>{try{localStorage.setItem(coachKey,JSON.stringify(coachData))}catch(e){console.warn('Lerncoach konnte nicht gespeichert werden',e)}};
const coachProfile=(n,type)=>coachData.profiles[n+':'+type]||{total:0,correct:0,wrong:0,slow:0,avgMs:0,last:0,streak:0};
function coachLog(q,ok,elapsed){
 const id=q.n+':'+q.type,p=coachProfile(q.n,q.type),ms=Math.max(0,Math.min(120000,elapsed));
 p.total++;p.correct+=ok?1:0;p.wrong+=ok?0:1;p.streak=ok?p.streak+1:0;
 // Keine starre individuelle Zeitbewertung vor ausreichend Daten; >45s als Unterbrechung behandeln.
 if(ms<=45000){p.avgMs=p.avgMs?Math.round(p.avgMs*.7+ms*.3):ms;if(ok&&ms>8000)p.slow++}
 p.last=Date.now();coachData.profiles[id]=p;coachSave();
}
function coachWeakness(n,type){
 let p=coachProfile(n,type),age=p.last?(Date.now()-p.last)/86400000:99;
 if(!p.total)return 2.5;
 let err=p.wrong/Math.max(1,p.total),slowness=p.total>=3?Math.min(2,Math.max(0,(p.avgMs-4500)/5500)):0;
 return 1+err*5+slowness+Math.min(2,age/14)-Math.min(.6,p.streak*.12);
}
function adaptivePlaceQuestions(){
 let pool=Array.from({length:learnedPlaceMax()},(_,i)=>i+1),count=20,types=['number','position','picture','next','previous'];
 if(!pool.length)return [];
 let questions=[],recent=[];
 for(let i=0;i<count;i++){
  let candidates=[];
  for(let n of pool)for(let type of types){if(type==='next'&&n===26||type==='previous'&&n===1)continue;
   let weight=coachWeakness(n,type);if(recent.includes(n))weight*=.18;
   candidates.push({n,type,weight});
  }
  // 40 % breit gestreute Fragen, 60 % gezielte Schwerpunkte; beide bleiben zufällig.
  let broad=i%5===0||i%5===3;
  let picked;
  if(broad){let available=candidates.filter(c=>!recent.includes(c.n));picked=shuffle(available.length?available:candidates)[0]}
  else{let total=candidates.reduce((sum,c)=>sum+c.weight,0),r=Math.random()*total;picked=candidates[candidates.length-1];for(let c of candidates){r-=c.weight;if(r<=0){picked=c;break}}}
  questions.push(placeQuestion(picked.n,picked.type,pool));recent.push(picked.n);if(recent.length>Math.min(5,pool.length-1))recent.shift();
 }
 return questions;
}
function beginAdaptiveTraining(){
 let qs=adaptivePlaceQuestions();if(!qs.length)return;
 adaptiveActive=true;placeSession={free:true,adaptive:true,st:placeStage(),questions:qs,idx:0,correct:0,per:{},miss:[],timings:[]};
 placeFeedback=null;courseView='exam';render();window.scrollTo(0,0);
}
const coachOldCheck=placeCheck;
placeCheck=function(value){
 if(!placeSession||placeFeedback)return;
 const q=placeSession.questions[placeSession.idx],ok=value===q.correct;
 const ms=placeQuestionShownAt?performance.now()-placeQuestionShownAt:0;
 coachLog(q,ok,ms);if(!placeSession.timings)placeSession.timings=[];
 placeSession.timings.push({n:q.n,type:q.type,ok,ms:Math.round(ms)});
 coachOldCheck(value);
};
const coachOldExamHtml=placeExamHtml;
placeExamHtml=function(){let html=coachOldExamHtml();return placeSession?.adaptive?html.replace('Freies Training</h1>','Intelligentes Training</h1>'):html};
const coachOldAdvance=placeAdvance;
placeAdvance=function(){
 const finishing=placeSession&&placeSession.idx===placeSession.questions.length-1;
 coachOldAdvance();
 if(finishing&&placeSession){let t=placeSession.timings||[];
  coachData.rounds.push({date:Date.now(),adaptive:!!placeSession.adaptive,free:!!placeSession.free,correct:placeSession.correct,total:placeSession.questions.length,avgMs:Math.round(t.filter(x=>x.ms<=45000).reduce((a,x)=>a+x.ms,0)/Math.max(1,t.filter(x=>x.ms<=45000).length))});
  coachData.rounds=coachData.rounds.slice(-80);coachSave();
 }
};
const coachOldCourse=course;
course=function(){return coachOldCourse()};
const coachOldHome=courseHome;
courseHome=function(){
 let html=coachOldHome(),max=learnedPlaceMax();
 let summary=coachSummary();
 let block=`<div class="panel"><h2>🧠 Dein Lerncoach</h2><p class="muted small">Antwortzeiten und Fehler werden bei jeder Ortsprüfung lokal erfasst. Einzelne langsame Antworten werden nicht überbewertet.</p>${max?`<p>${summary}</p><button id="adaptiveStart" style="width:100%">✨ Empfohlenes Training starten</button><p class="small muted">20 Fragen · Schwerpunkt auf unsicheren Verbindungen · keine Freischaltung</p>`:'<p class="muted">Nach der ersten bestandenen Etappe kannst du gezielt trainieren.</p>'}<button id="coachStats" class="secondary" style="width:100%">Lernstatistik ansehen</button></div>`;
 return html.replace('<div class="panel"><h2>Dein Weg</h2>',block+'<div class="panel"><h2>Dein Weg</h2>');
};
function coachSummary(){
 let max=learnedPlaceMax(),all=[];
 for(let n=1;n<=max;n++)for(let t of ['number','position','picture','next','previous']){
  if(t==='previous'&&n===1||t==='next'&&n===26)continue;
  let p=coachProfile(n,t);if(p.total>=3)all.push({n,t,score:coachWeakness(n,t),p});
 }
 if(!all.length)return 'Noch nicht genügend Antworten für eine persönliche Empfehlung. Trainiere zunächst einige Runden.';
 all.sort((a,b)=>b.score-a.score);
 let top=[...new Set(all.slice(0,5).map(x=>x.n))].slice(0,3);
 return `Heute besonders üben: <b>${top.map(n=>`${n} · ${escapeHtml(placeLabel(n))}`).join(', ')}</b>.`;
}
function coachStatsHtml(){
 let max=learnedPlaceMax(),rows=[];
 for(let n=1;n<=max;n++){
  let p=Object.entries(coachData.profiles).filter(([key])=>key.startsWith(n+':')).map(([,p])=>p);
  let total=p.reduce((a,x)=>a+x.total,0),right=p.reduce((a,x)=>a+x.correct,0),times=p.filter(x=>x.avgMs>0),avg=times.length?times.reduce((a,x)=>a+x.avgMs,0)/times.length:0;
  rows.push(`<div class="book-step"><b>${n} · ${escapeHtml(placeLabel(n))}</b><br><span class="small muted">${total?`${right}/${total} richtig · Ø ${((avg||0)/1000).toFixed(1)} s (Schätzwert)`: 'Noch keine Antworten'}</span></div>`);
 }
 let rounds=coachData.rounds.slice(-5).reverse();
 return `<h1>🧠 Lernstatistik</h1><p class="muted">Orte und Fragerichtungen werden getrennt gespeichert. Die Durchschnittszeiten sind geglättete Näherungswerte; Pausen über 45 Sekunden werden nicht eingerechnet.</p><div class="panel"><h2>Deine letzten Runden</h2>${rounds.length?rounds.map(r=>`<p class="small">${new Date(r.date).toLocaleDateString('de-DE')}: ${r.correct}/${r.total} richtig · Ø ${(r.avgMs/1000).toFixed(1)} s</p>`).join(''):'<p class="muted">Noch keine abgeschlossene Runde.</p>'}</div><div class="panel"><h2>Orte im Überblick</h2>${rows.join('')||'<p class="muted">Noch keine abgeschlossenen Etappen.</p>'}</div><p><button id="coachBack" class="secondary" style="width:100%">Zurück zum Lernkurs</button></p>`;
}
const coachCourseRender=course;
course=function(){if(courseView==='coachStats')return coachStatsHtml();return coachCourseRender()};
const coachOldBind=bind;
bind=function(){coachOldBind();if($('adaptiveStart'))$('adaptiveStart').onclick=beginAdaptiveTraining;
 if($('coachStats'))$('coachStats').onclick=()=>{courseView='coachStats';render();window.scrollTo(0,0)};
 if($('coachBack'))$('coachBack').onclick=()=>{courseView='intro';render();window.scrollTo(0,0)};
 if(page==='course'&&courseView==='exam'&&!placeFeedback)placeQuestionShownAt=performance.now();
};
const coachOldDone=placeExamDone;
placeExamDone=function(){
 let html=coachOldDone();if(!placeSession)return html;
 let t=placeSession.timings||[],valid=t.filter(x=>x.ms<=45000),avg=valid.length?valid.reduce((a,x)=>a+x.ms,0)/valid.length:0;
 let slow=t.filter(x=>x.ok&&x.ms>8000&&x.ms<=45000).map(x=>x.n),miss=t.filter(x=>!x.ok).map(x=>x.n);
 let focus=[...new Set([...miss,...slow])].slice(0,5);
 let box=`<div class="panel"><h2>🧠 Auswertung</h2><p>${valid.length?`Ø Antwortzeit: <b>${(avg/1000).toFixed(1)} Sekunden</b> (ohne längere Pausen).`:'Noch keine Zeitdaten.'}</p>${focus.length?`<p>Zum Wiederholen: ${focus.map(n=>`${n} · ${escapeHtml(placeLabel(n))}`).join(', ')}.</p>`:'<p class="good">Keine auffälligen Antworten in dieser Runde.</p>'}<p class="small muted">Die Einschätzung wird über mehrere Runden zuverlässiger.</p>${learnedPlaceMax()?'<button id="adaptiveAgain" style="width:100%">✨ Empfohlenes Training starten</button>':''}</div>`;
 return html+box;
};
const coachDoneBind=bind;
bind=function(){coachDoneBind();if($('adaptiveAgain'))$('adaptiveAgain').onclick=beginAdaptiveTraining};

</script></body></html>
