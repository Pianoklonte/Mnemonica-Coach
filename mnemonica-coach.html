<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b28"><title>Mnemonica Coach</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f4f6fa;background:#101b28}*{box-sizing:border-box}body{margin:0}main{max-width:520px;margin:auto;padding:24px 18px 90px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:12px 0 4px}h2{font-size:20px}.muted{color:#9eafc1}.panel{background:#1d2b3b;border:1px solid #344357;border-radius:20px;padding:18px;margin-top:18px}.stat{display:flex;justify-content:space-between;gap:10px}.stat>div{flex:1;text-align:center;background:#26384b;padding:12px 4px;border-radius:12px}.stat strong{display:block;font-size:22px}button,input,select{font:inherit}button{border:0;border-radius:13px;background:#d5b779;color:#172333;font-weight:700;padding:14px 16px;cursor:pointer}button.secondary{background:#31465d;color:white}button:disabled{opacity:.4}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1}.card{background:#fff;color:#1a2230;border-radius:16px;border:2px solid #e1e5e8;width:170px;height:238px;margin:20px auto;display:flex;flex-direction:column;justify-content:space-between;padding:12px;box-shadow:0 12px 25px #0004}.card .corner{font-size:24px;font-weight:800}.card .center{font-size:64px;text-align:center}.red{color:#cb263a}.question{text-align:center;font-size:23px;font-weight:750;margin-top:22px}.number{font-size:88px;text-align:center;font-weight:800;margin:35px 0}.answer{width:100%;padding:15px;border-radius:12px;background:#101b28;color:white;border:1px solid #61738a;font-size:20px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.grid button{padding:11px 2px}.small{font-size:13px}.hidden{display:none}.good{color:#86d7a6}.bad{color:#ff9a9a}.pill{display:inline-block;background:#30465a;padding:6px 10px;border-radius:30px;font-size:12px}.stack{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stack>div{background:#26384b;padding:10px;border-radius:10px}textarea{width:100%;min-height:76px;background:#101b28;color:white;border:1px solid #53677c;border-radius:10px;padding:10px}nav{position:fixed;bottom:0;left:0;right:0;background:#152333;border-top:1px solid #344357;display:flex;justify-content:center;padding:10px 10px max(10px,env(safe-area-inset-bottom))}nav button{background:transparent;color:#c3cbd6;padding:10px 16px;font-size:13px}nav button.active{color:#e4c78b} .progress{height:8px;background:#33475a;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:#d5b779} .feedback{margin-top:15px;padding:12px;border-radius:12px;background:#2b3c4c} </style></head><body><main><header><span class="pill">♠ MNEMONICA COACH</span><span id="headProgress" class="muted small"></span></header><section id="screen"></section></main><nav><button data-nav="home" class="active">⌂ Start</button><button data-nav="stack">▦ Stapel</button><button data-nav="stats">◉ Fortschritt</button></nav><script>
const raw='4C 2H 7D 3C 4H 6D AS 5H 9S 2S QH 3D QC 8H 6S 5S 9H KC 2D JH 3S 8S 6H TC 5D KD 2C 3H 8D 5C KS JD 8C TS KH JC 7S TH AD 4S 7H 4D AC 9C JS QD 7C QS TD 6C AH 9D'.split(' ');const suit={C:'♣',D:'♦',H:'♥',S:'♠'},names={C:'Kreuz',D:'Karo',H:'Herz',S:'Pik'},ranks={A:'Ass',K:'König',Q:'Dame',J:'Bube',T:'10'};const cards=raw.map((id,i)=>({id,pos:i+1,s:id.slice(-1),r:id.slice(0,-1),name:names[id.slice(-1)]+' '+(ranks[id.slice(0,-1)]||id.slice(0,-1))}));const key='mnemonica-coach-v1';let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}state=state||{unlocked:5,records:{},notes:{},history:[],sessions:0};let page='home',phase='intro',queue=[],idx=0,current=null,dir='position',result=null,sessionAnswers=0,sessionCorrect=0;const $=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(state)),rec=c=>state.records[c.id]||{right:0,wrong:0,streak:0,due:0},mastered=c=>{let r=rec(c);return r.streak>=3&&r.right>=4},known=()=>cards.slice(0,state.unlocked).filter(mastered).length;function cardHtml(c){return `<div class="card ${'DH'.includes(c.s)?'red':''}"><div class="corner">${c.r==='T'?'10':c.r} ${suit[c.s]}</div><div class="center">${suit[c.s]}</div><div class="corner" style="text-align:right">${c.r==='T'?'10':c.r} ${suit[c.s]}</div></div>`}function home(){let k=known(),due=cards.slice(0,state.unlocked).filter(c=>rec(c).due<=Date.now()).length;return `<h1>Dein Kartengedächtnis 🃏</h1><p class="muted">Fünf Minuten am Tag. Eine Karte nach der anderen.</p><div class="panel"><div class="stat"><div><strong>${state.unlocked}/52</strong><span class="small">Freigeschaltet</span></div><div><strong>${k}</strong><span class="small">Gefestigt</span></div><div><strong>${due}</strong><span class="small">Zum Üben</span></div></div><h2>Dein nächster Schritt</h2><p class="muted">${state.sessions===0?'Lerne die ersten fünf Karten kennen und teste anschließend dein Gedächtnis.':'Wiederhole deine Karten in beide Richtungen. Schwierige Karten kommen häufiger vor.'}</p><button style="width:100%" id="start">${state.sessions===0?'Jetzt lernen':'Training starten'}</button><p class="small muted">Ohne Zeitdruck · Fortschritt auf diesem Gerät gespeichert</p></div><div class="panel"><h2>Lernportion</h2><p>Karten 1–${state.unlocked}. Neue Karten erst, wenn du bereit bist.</p><div class="progress"><div style="width:${k/state.unlocked*100}%"></div></div><p class="small muted">${k} von ${state.unlocked} gefestigt (mindestens 4 richtige Antworten und 3 in Folge)</p><button class="secondary" id="expand" ${state.unlocked>=52?'disabled':''}>Nächste 5 Karten hinzufügen</button></div>`}function start(){page='learn';phase='intro';idx=0;queue=cards.slice(Math.max(0,state.unlocked-5),state.unlocked);render()}function training(){page='learn';phase='quiz';sessionAnswers=0;sessionCorrect=0;let eligible=cards.slice(0,state.unlocked);queue=Array.from({length:Math.min(12,Math.max(8,eligible.length*2))},()=>{let weights=eligible.map(c=>{let r=rec(c);return 1+(r.wrong*1.5)/(r.right+1)+(r.due<=Date.now()?3:0)+(r.right===0?3:0)});let n=Math.random()*weights.reduce((a,b)=>a+b,0);return eligible[weights.findIndex(w=>(n-=w)<=0)]||eligible[0]});idx=0;next()}function next(){result=null;if(idx>=queue.length){phase='done';state.sessions++;save();render();return}current=queue[idx];dir=idx%2===0?'position':'card';phase='quiz';render()}function record(ok){let r=rec(current);r.right+=ok?1:0;r.wrong+=ok?0:1;r.streak=ok?r.streak+1:0;let intervals=[0,1,3,7,14,30];r.due=Date.now()+(ok?intervals[Math.min(r.streak,5)]*86400000:0);state.records[current.id]=r;state.history.push({date:new Date().toISOString(),id:current.id,ok});sessionAnswers++;if(ok)sessionCorrect++;save()}function quizHtml(){let progress=`<p class="muted small">Frage ${idx+1} von ${queue.length}</p><div class="progress"><div style="width:${idx/queue.length*100}%"></div></div>`;let q=dir==='position'?`<div class="question">Auf welcher Position liegt diese Karte?</div>${cardHtml(current)}<input id="entry" class="answer" inputmode="numeric" type="number" min="1" max="52" placeholder="Position 1–52" autocomplete="off"><p><button id="check" style="width:100%">Prüfen</button></p>`:`<div class="question">Welche Karte liegt auf Position</div><div class="number">${current.pos}?</div><div class="actions"><select id="rank" class="answer" style="flex:1"><option value="">Wert wählen</option>${['A','2','3','4','5','6','7','8','9','T','J','Q','K'].map(v=>`<option value="${v}">${ranks[v]||v}</option>`).join('')}</select><select id="suit" class="answer" style="flex:1"><option value="">Farbe</option>${Object.keys(suit).map(v=>`<option value="${v}">${names[v]} ${suit[v]}</option>`).join('')}</select></div><p><button id="check" style="width:100%">Prüfen</button></p>`;if(result!==null){q= `<div class="question ${result?'good':'bad'}">${result?'Richtig! ✓':'Noch nicht ganz'}</div>${cardHtml(current)}<p style="text-align:center">Position <b>${current.pos}</b> · ${current.name}</p><div class="feedback">${hint(current)}</div><p><button id="next" style="width:100%">${idx+1===queue.length?'Ergebnis ansehen':'Nächste Frage'}</button></p>`}return progress+q}function hint(c){let n=state.notes[c.id];return n?`💡 Deine Merkhilfe: ${escapeHtml(n)}`:'💡 Tipp: Verbinde die Karte mit ihrer Zahl in einem möglichst ungewöhnlichen inneren Bild. Unter „Stapel“ kannst du deine eigene Merkhilfe speichern.'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function learn(){if(phase==='intro'){let c=queue[idx];return `<h1>Neue Karten entdecken</h1><p class="muted">Schau dir Karte und Position an. Sprich beides laut aus und stell dir eine Verbindung vor.</p><p class="small muted">Karte ${idx+1} von ${queue.length}</p>${cardHtml(c)}<div class="question">Position ${c.pos}</div><p style="text-align:center">${c.name}</p><div class="feedback">${hint(c)}</div><p><button id="introNext" style="width:100%">${idx+1===queue.length?'Jetzt abfragen':'Nächste Karte'}</button></p>`}if(phase==='done')return `<h1>Training geschafft! 🎉</h1><div class="panel"><div class="number">${sessionCorrect}/${sessionAnswers}</div><p style="text-align:center">Richtige Antworten</p><p class="muted">Unsichere Karten werden beim nächsten Training bevorzugt. Es ist völlig normal, anfangs Fehler zu machen.</p><button id="again" style="width:100%">Noch eine Runde</button></div>`;return `<h1>Gedächtnistraining</h1>${quizHtml()}`}function stack(){return `<h1>Der komplette Stack</h1><p class="muted">Tippe auf eine Karte, um eine persönliche Eselsbrücke zu speichern.</p><div class="stack">${cards.map(c=>`<div data-card="${c.pos}"><b>${c.pos}.</b> <span class="${'DH'.includes(c.s)?'bad':''}">${c.r==='T'?'10':c.r}${suit[c.s]}</span> ${c.name} ${state.notes[c.id]?'💡':''}</div>`).join('')}</div><div id="notePanel"></div>`}function stats(){let h=state.history;let correct=h.filter(x=>x.ok).length;return `<h1>Dein Fortschritt</h1><div class="panel stat"><div><strong>${h.length}</strong><span class="small">Antworten</span></div><div><strong>${h.length?Math.round(correct/h.length*100):0}%</strong><span class="small">Trefferquote</span></div><div><strong>${state.sessions}</strong><span class="small">Trainings</span></div></div><div class="panel"><h2>Was du schon kannst</h2><p>${known()} Karten sind gefestigt. Du trainierst aktuell ${state.unlocked} Karten.</p><p class="small muted">Die Trefferquote umfasst alle bisherigen Antworten auf diesem Gerät.</p></div><div class="panel"><h2>Daten</h2><button id="export" class="secondary">Lernstand sichern (JSON)</button><p class="small muted">Speicherung erfolgt nur in diesem Browser. Beim Löschen der Browserdaten kann der Fortschritt verloren gehen.</p><button id="reset" class="secondary">Lernstand zurücksetzen</button></div>`}function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));$('headProgress').textContent=`${known()} gefestigt`; $('screen').innerHTML=page==='home'?home():page==='learn'?learn():page==='stack'?stack():stats();bind()}function bind(){let b=id=>$(id);if(b('start'))b('start').onclick=()=>state.sessions===0?start():training();if(b('expand'))b('expand').onclick=()=>{state.unlocked=Math.min(52,state.unlocked+5);save();start()};if(b('introNext'))b('introNext').onclick=()=>{idx++;if(idx>=queue.length)training();else render()};if(b('check')){b('check').onclick=()=>{let v=dir==='position'?Number(b('entry').value):b('rank').value+b('suit').value;if(!v)return;result=dir==='position'?v===current.pos:v===current.id;record(result);render()};if(b('entry'))b('entry').onkeydown=e=>{if(e.key==='Enter')b('check').click()}}if(b('next'))b('next').onclick=()=>{idx++;next()};if(b('again'))b('again').onclick=training;if(b('reset'))b('reset').onclick=()=>{if(confirm('Wirklich den gesamten Lernfortschritt löschen?')){localStorage.removeItem(key);location.reload()}};if(b('export'))b('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='mnemonica-lernstand.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};document.querySelectorAll('[data-card]').forEach(el=>el.onclick=()=>{let c=cards[Number(el.dataset.card)-1];$('notePanel').innerHTML=`<div class="panel"><h2>${c.pos}. ${c.name}</h2><p class="muted">Deine persönliche Merkhilfe</p><textarea id="noteText">${escapeHtml(state.notes[c.id]||'')}</textarea><p><button id="saveNote">Speichern</button></p></div>`;$('saveNote').onclick=()=>{state.notes[c.id]=$('noteText').value;save();render()};$('notePanel').scrollIntoView({behavior:'smooth',block:'nearest'})})}document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render()});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
